name: KONz Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Public HTTPS address of the responsive web edition'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build responsive application
        env:
          VITE_KONZ_WEB_URL: ${{ inputs.web_url }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec vite build
      - name: Sync native Android plugins
        run: |
          node capacitor.config.generator.mjs
          pnpm exec cap sync android
      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.KONZ_ANDROID_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/konz-android.p12"
      - name: Build signed APK
        env:
          KONZ_KEYSTORE: ${{ runner.temp }}/konz-android.p12
          KONZ_KEYSTORE_PASSWORD: ${{ secrets.KONZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease
      - name: Stage APK
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release.apk android-output/KONz-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KONz-Android
          path: app/android-output/KONz-Android.apk
          retention-days: 14
